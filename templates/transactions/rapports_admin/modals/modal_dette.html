<!-- MODAL DETTE -->
<div id="modalDette" class="modal">
    <div class="modal-content">
        <div class="modal-header"><h3>➕ Nouvelle dette</h3><button class="modal-close" onclick="closeModal('modalDette')">&times;</button></div>
        <div class="modal-body">
            <form method="post" action="{% url 'ajouter_dette' %}" id="detteForm">
                {% csrf_token %}
                <div class="form-group">
                    <label>Nom du débiteur *</label>
                    <div style="position:relative;">
                        <input type="text" name="nom_debiteur" id="nom_debiteur" class="form-control" placeholder="Saisir le nom..." autocomplete="off" required>
                        <div id="debiteur-suggestions" class="autocomplete-suggestions"></div>
                    </div>
                    <small style="display:block; margin-top:4px; font-size:11px; color:var(--gray-500);">Si le nom n'existe pas, il sera créé automatiquement</small>
                </div>
                <div class="form-group"><label>Téléphone (optionnel)</label><input type="tel" name="telephone" id="debiteur_telephone" class="form-control"></div>
                <div class="form-group"><label>Email (optionnel)</label><input type="email" name="email" id="debiteur_email" class="form-control"></div>
                <div class="form-group"><label>Montant (FCFA) *</label><input type="number" name="montant" id="dette_montant" required min="1" class="form-control"></div>
                <div class="form-group"><label>Date échéance *</label><input type="date" name="date_echeance" id="dette_echeance" required class="form-control"></div>
                <div class="form-group"><label>Motif</label><textarea name="motif" rows="3" class="form-control"></textarea></div>
                <button type="submit" class="btn-submit">Enregistrer</button>
                <button type="button" class="btn-close-modal" onclick="closeModal('modalDette')">Annuler</button>
            </form>
        </div>
    </div>
</div>
