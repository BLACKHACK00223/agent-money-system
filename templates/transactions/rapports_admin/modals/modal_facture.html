<!-- MODAL FACTURE -->
<div id="modalFacture" class="modal">
    <div class="modal-content">
        <div class="modal-header"><h3>Nouvelle facture</h3><button class="modal-close" onclick="closeModal('modalFacture')">&times;</button></div>
        <div class="modal-body">
            <form method="post" action="{% url 'creer_facture' %}">
                {% csrf_token %}
                <div class="type-selector">
                    <label class="type-card"><input type="radio" name="type_facture" value="cliente" required><div class="icon-symbol">💰</div><div class="title">Client nous doit</div></label>
                    <label class="type-card"><input type="radio" name="type_facture" value="fournisseur" required><div class="icon-symbol">🏦</div><div class="title">Nous devons à</div></label>
                </div>
                <div class="form-group"><label>Téléphone</label><input type="text" name="numero_client" placeholder="76 12 34 56" class="form-control"></div>
                <div class="form-group"><label>Nom</label><input type="text" name="personne_nom" required class="form-control"></div>
                <div class="form-group"><label>Montant (FCFA)</label><input type="number" name="montant_total" required min="1" class="form-control"></div>
                <div class="form-group"><label>Échéance</label><input type="date" name="date_echeance" required class="form-control"></div>
                <button type="submit" class="btn-submit">Créer la facture</button>
                <button type="button" class="btn-close-modal" onclick="closeModal('modalFacture')">Annuler</button>
            </form>
        </div>
    </div>
</div>
