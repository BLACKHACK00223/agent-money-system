<!-- templates/transactions/historique_operations.html -->
{% extends "transactions/dashboard_admin.html" %}
{% load humanize %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/historique_operations.css' %}">
{% endblock %}

{% block content %}
<div class="page-header">
    <div class="page-title">
        <h1>📜 Historique des opérations</h1>
    </div>
    <a href="{% url 'gestion_agents' %}" class="back-btn">← Retour</a>
</div>

<!-- Statistiques compactes -->
<div class="stats-grid">
    <div class="stat-card">
        <div class="stat-icon">📤</div>
        <div class="stat-info">
            <div class="stat-value" id="stat-ajouts">0</div>
            <div class="stat-label">Total Ajouts</div>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon">📥</div>
        <div class="stat-info">
            <div class="stat-value" id="stat-retraits">0</div>
            <div class="stat-label">Total Retraits</div>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon">💰</div>
        <div class="stat-info">
            <div class="stat-value" id="stat-solde">0</div>
            <div class="stat-label">Solde Net</div>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon">📋</div>
        <div class="stat-info">
            <div class="stat-value" id="stat-nb">0</div>
            <div class="stat-label">Nb opérations</div>
        </div>
    </div>
</div>

<!-- Filtres - TOUT SUR UNE LIGNE -->
<div class="filters-bar">
    <div class="filter-group">
        <label>📅 DATE DEBUT</label>
        <input type="date" id="filter-date-debut">
    </div>
    <div class="filter-group">
        <label>📅 DATE FIN</label>
        <input type="date" id="filter-date-fin">
    </div>
    <div class="filter-group">
        <label>👤 AGENT</label>
        <select id="filter-agent">
            <option value="">Tous les agents</option>
            {% for agent in agents %}
            <option value="{{ agent.id }}">{{ agent.nom }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="filter-group">
        <label>🔄 TYPE</label>
        <select id="filter-type">
            <option value="">Tous les types</option>
            <option value="decaissement">📤 Ajout</option>
            <option value="encaissement">📥 Retrait</option>
        </select>
    </div>
    <div class="filter-actions">
        <button class="btn-filter" onclick="applyFilters()">🔍 Appliquer</button>
        <button class="btn-reset" onclick="resetFilters()">🗑️ Réinitialiser</button>
    </div>
</div>

<!-- Tableau -->
<div class="table-container">
    <div id="table-content">
        <div class="empty-state">
            <div class="empty-state-icon">⏳</div>
            <div>Chargement...</div>
        </div>
    </div>
</div>

<div id="pagination-container" class="pagination"></div>

<div class="loading" id="loading">⏳ Chargement...</div>

<script>
    let currentPage = 1;

    async function loadHistorique() {
        const loading = document.getElementById('loading');
        loading.style.display = 'flex';

        const params = new URLSearchParams();
        params.set('page', currentPage);
        
        const dateDebut = document.getElementById('filter-date-debut').value;
        const dateFin = document.getElementById('filter-date-fin').value;
        const agentId = document.getElementById('filter-agent').value;
        const typeOp = document.getElementById('filter-type').value;
        
        if (dateDebut) params.set('date_debut', dateDebut);
        if (dateFin) params.set('date_fin', dateFin);
        if (agentId) params.set('agent_id', agentId);
        if (typeOp) params.set('type', typeOp);

        try {
            const response = await fetch(`/api/historique-agent/page/?${params.toString()}`);
            const data = await response.json();
            
            if (data.success) {
                updateStats(data.stats);
                renderTable(data.historique);
                renderPagination(data.pagination);
            } else {
                document.getElementById('table-content').innerHTML = '<div class="empty-state">❌ Erreur de chargement</div>';
            }
        } catch (err) {
            document.getElementById('table-content').innerHTML = '<div class="empty-state">🔌 Erreur de connexion</div>';
        } finally {
            loading.style.display = 'none';
        }
    }

    function updateStats(stats) {
        const ajouts = stats.total_ajouts || 0;
        const retraits = stats.total_retraits || 0;
        const solde = ajouts - retraits;
        
        document.getElementById('stat-ajouts').innerHTML = ajouts.toLocaleString() + ' F';
        document.getElementById('stat-retraits').innerHTML = retraits.toLocaleString() + ' F';
        document.getElementById('stat-solde').innerHTML = solde.toLocaleString() + ' F';
        document.getElementById('stat-solde').className = 'stat-value ' + (solde >= 0 ? 'positive' : 'negative');
        document.getElementById('stat-nb').innerHTML = (stats.total_operations || 0).toLocaleString();
    }

    function renderTable(historique) {
        if (!historique || historique.length === 0) {
            document.getElementById('table-content').innerHTML = '<div class="empty-state">📭 Aucune opération trouvée</div>';
            return;
        }

        let html = `
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Type</th>
                        <th>Opérateur</th>
                        <th>Agent</th>
                        <th>Montant</th>
                        <th>Description</th>
                    </tr>
                </thead>
                <tbody>
        `;

        for (const op of historique) {
            const isAjout = op.type_operation === 'decaissement';
            const badgeClass = isAjout ? 'badge-success' : 'badge-danger';
            const badgeText = isAjout ? '📤 Ajout' : '📥 Retrait';
            const amountClass = isAjout ? 'amount-positive' : 'amount-negative';
            const operatorIcon = op.operateur_type === 'admin' ? '👨‍💼' : '🤝';
            
            html += `
                <tr>
                    <td style="white-space: nowrap;">${op.date}</td>
                    <td><span class="badge ${badgeClass}">${badgeText}</span></td>
                    <td>${operatorIcon} ${op.operateur_nom}</td>
                    <td><strong>${op.agent}</strong></td>
                    <td class="${amountClass}">${op.montant_total.toLocaleString()} FCFA</td>
                    <td style="color: var(--gray-500);">${op.description || '—'}</td>
                </tr>
            `;
        }

        html += `
                </tbody>
            </table>
        `;
        
        document.getElementById('table-content').innerHTML = html;
    }

    function renderPagination(pagination) {
        const container = document.getElementById('pagination-container');
        
        if (!pagination || pagination.total_pages <= 1) {
            container.innerHTML = '';
            return;
        }
        
        let html = '';
        
        if (pagination.has_previous) {
            html += `<button class="page-btn" data-page="${pagination.previous_page}">← Précédent</button>`;
        } else {
            html += `<span class="page-btn disabled">← Précédent</span>`;
        }
        
        for (let i = pagination.start_page; i <= pagination.end_page; i++) {
            if (i === pagination.current_page) {
                html += `<span class="page-btn active">${i}</span>`;
            } else {
                html += `<button class="page-btn" data-page="${i}">${i}</button>`;
            }
        }
        
        if (pagination.has_next) {
            html += `<button class="page-btn" data-page="${pagination.next_page}">Suivant →</button>`;
        } else {
            html += `<span class="page-btn disabled">Suivant →</span>`;
        }
        
        container.innerHTML = html;
        
        document.querySelectorAll('.page-btn[data-page]').forEach(btn => {
            btn.addEventListener('click', () => {
                currentPage = parseInt(btn.dataset.page);
                loadHistorique();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        });
    }

    function applyFilters() {
        currentPage = 1;
        loadHistorique();
    }

    function resetFilters() {
        document.getElementById('filter-date-debut').value = '';
        document.getElementById('filter-date-fin').value = '';
        document.getElementById('filter-agent').value = '';
        document.getElementById('filter-type').value = '';
        currentPage = 1;
        loadHistorique();
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadHistorique();
    });
</script>
{% endblock %}
