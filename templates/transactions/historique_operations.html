<!-- templates/transactions/historique_operations.html -->
{% extends "transactions/dashboard_admin.html" %}
{% load humanize %}
{% load static %}

{% block extra_css %}
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap');

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --primary: #6366f1;
        --primary-dark: #4f46e5;
        --primary-light: #eef2ff;
        --success: #10b981;
        --success-light: #d1fae5;
        --danger: #ef4444;
        --danger-light: #fee2e2;
        --warning: #f59e0b;
        --warning-light: #fef3c7;
        --info: #3b82f6;
        --info-light: #dbeafe;
        --gray-50: #f9fafb;
        --gray-100: #f3f4f6;
        --gray-200: #e5e7eb;
        --gray-300: #d1d5db;
        --gray-400: #9ca3af;
        --gray-500: #6b7280;
        --gray-600: #4b5563;
        --gray-700: #374151;
        --gray-800: #1f2937;
        --gray-900: #111827;
        --shadow-xs: 0 1px 2px 0 rgba(0,0,0,0.05);
        --shadow-sm: 0 1px 3px 0 rgba(0,0,0,0.1), 0 1px 2px -1px rgba(0,0,0,0.1);
        --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
    }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, var(--gray-50) 0%, #f3f4f6 100%);
        color: var(--gray-900);
    }

    /* HEADER */
    .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        padding: 20px 24px 0 24px;
    }

    .page-title h1 {
        font-size: 24px;
        font-weight: 700;
        color: var(--gray-900);
        margin: 0;
    }

    .back-btn {
        background: white;
        border: 1px solid var(--gray-200);
        padding: 8px 16px;
        border-radius: 12px;
        color: var(--gray-700);
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 500;
        transition: all 0.2s ease;
    }

    .back-btn:hover {
        background: var(--gray-50);
        border-color: var(--gray-300);
    }

    /* STATS COMPACTES */
    .stats-grid {
        display: flex;
        gap: 16px;
        margin: 0 24px 24px 24px;
    }

    .stat-card {
        flex: 1;
        background: white;
        border-radius: 16px;
        padding: 12px 16px;
        border: 1px solid var(--gray-200);
        display: flex;
        align-items: center;
        gap: 12px;
        transition: all 0.2s ease;
    }

    .stat-card:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
    }

    .stat-icon {
        font-size: 28px;
    }

    .stat-info {
        flex: 1;
    }

    .stat-value {
        font-size: 20px;
        font-weight: 700;
        color: var(--gray-900);
        line-height: 1.2;
    }

    .stat-label {
        font-size: 11px;
        color: var(--gray-500);
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.3px;
    }

    .stat-value.positive { color: var(--success); }
    .stat-value.negative { color: var(--danger); }

    /* FILTRES - TOUT SUR UNE LIGNE */
    .filters-bar {
        background: white;
        margin: 0 24px 24px 24px;
        border-radius: 16px;
        border: 1px solid var(--gray-200);
        padding: 12px 16px;
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 12px;
    }

    .filter-group {
        flex: 1;
        min-width: 130px;
    }

    .filter-group label {
        display: block;
        font-size: 10px;
        font-weight: 600;
        color: var(--gray-500);
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.3px;
    }

    .filter-group input,
    .filter-group select {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--gray-200);
        border-radius: 10px;
        font-size: 12px;
        background: var(--gray-50);
        font-family: inherit;
        transition: all 0.2s ease;
    }

    .filter-group input:focus,
    .filter-group select:focus {
        outline: none;
        border-color: var(--primary);
        background: white;
        box-shadow: 0 0 0 3px var(--primary-light);
    }

    .filter-actions {
        display: flex;
        gap: 8px;
    }

    .btn-filter, .btn-reset {
        padding: 8px 16px;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: none;
        white-space: nowrap;
    }

    .btn-filter {
        background: var(--primary);
        color: white;
    }

    .btn-filter:hover {
        background: var(--primary-dark);
    }

    .btn-reset {
        background: white;
        color: var(--gray-700);
        border: 1px solid var(--gray-200);
    }

    .btn-reset:hover {
        background: var(--gray-50);
    }

    /* TABLEAU */
    .table-container {
        margin: 0 24px 24px 24px;
        background: white;
        border-radius: 16px;
        border: 1px solid var(--gray-200);
        overflow: hidden;
    }

    .data-table {
        width: 100%;
        border-collapse: collapse;
    }

    .data-table th {
        text-align: left;
        padding: 12px 16px;
        background: var(--gray-50);
        font-size: 11px;
        font-weight: 600;
        color: var(--gray-600);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border-bottom: 1px solid var(--gray-200);
    }

    .data-table td {
        padding: 12px 16px;
        border-bottom: 1px solid var(--gray-100);
        font-size: 12px;
        vertical-align: middle;
    }

    .data-table tr:hover td {
        background: var(--gray-50);
    }

    /* Badges */
    .badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 600;
    }

    .badge-success {
        background: var(--success-light);
        color: var(--success);
    }

    .badge-danger {
        background: var(--danger-light);
        color: var(--danger);
    }

    .amount-positive { color: var(--success); font-weight: 600; }
    .amount-negative { color: var(--danger); font-weight: 600; }

    /* PAGINATION */
    .pagination {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin: 24px;
    }

    .page-btn {
        padding: 6px 12px;
        background: white;
        border: 1px solid var(--gray-200);
        border-radius: 10px;
        font-size: 12px;
        cursor: pointer;
        color: var(--gray-700);
        transition: all 0.2s ease;
        min-width: 36px;
    }

    .page-btn:hover {
        background: var(--gray-50);
        border-color: var(--gray-300);
    }

    .page-btn.active {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
    }

    .page-btn.disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }

    .empty-state {
        text-align: center;
        padding: 40px 20px;
    }

    .empty-state-icon {
        font-size: 48px;
        margin-bottom: 12px;
        opacity: 0.5;
    }

    .loading {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0,0,0,0.85);
        backdrop-filter: blur(8px);
        color: white;
        padding: 12px 24px;
        border-radius: 40px;
        z-index: 1000;
        font-size: 13px;
        gap: 8px;
        align-items: center;
    }

    /* RESPONSIVE */
    @media (max-width: 1000px) {
        .filters-bar {
            flex-wrap: wrap;
        }
        .filter-group {
            min-width: calc(33% - 8px);
        }
        .filter-actions {
            min-width: auto;
        }
    }

    @media (max-width: 768px) {
        .stats-grid {
            flex-direction: column;
            margin: 0 16px 20px 16px;
            gap: 10px;
        }
        .filters-bar {
            margin: 0 16px 20px 16px;
            flex-direction: column;
            align-items: stretch;
        }
        .filter-group {
            min-width: auto;
        }
        .filter-actions {
            flex-direction: row;
            margin-top: 4px;
        }
        .btn-filter, .btn-reset {
            flex: 1;
            justify-content: center;
        }
        .table-container {
            margin: 0 16px 20px 16px;
            overflow-x: auto;
        }
        .page-header {
            padding: 16px 16px 0 16px;
            flex-direction: column;
            align-items: flex-start;
        }
        .data-table {
            min-width: 700px;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="page-header">
    <div class="page-title">
        <h1>📜 Historique des opérations</h1>
    </div>
    <a href="{% url 'gestion_agents' %}" class="back-btn">← Retour</a>
</div>

<!-- Statistiques compactes -->
<div class="stats-grid">
    <div class="stat-card">
        <div class="stat-icon">📤</div>
        <div class="stat-info">
            <div class="stat-value" id="stat-ajouts">0</div>
            <div class="stat-label">Total Ajouts</div>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon">📥</div>
        <div class="stat-info">
            <div class="stat-value" id="stat-retraits">0</div>
            <div class="stat-label">Total Retraits</div>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon">💰</div>
        <div class="stat-info">
            <div class="stat-value" id="stat-solde">0</div>
            <div class="stat-label">Solde Net</div>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon">📋</div>
        <div class="stat-info">
            <div class="stat-value" id="stat-nb">0</div>
            <div class="stat-label">Nb opérations</div>
        </div>
    </div>
</div>

<!-- Filtres - TOUT SUR UNE LIGNE -->
<div class="filters-bar">
    <div class="filter-group">
        <label>📅 DATE DEBUT</label>
        <input type="date" id="filter-date-debut">
    </div>
    <div class="filter-group">
        <label>📅 DATE FIN</label>
        <input type="date" id="filter-date-fin">
    </div>
    <div class="filter-group">
        <label>👤 AGENT</label>
        <select id="filter-agent">
            <option value="">Tous les agents</option>
            {% for agent in agents %}
            <option value="{{ agent.id }}">{{ agent.nom }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="filter-group">
        <label>🔄 TYPE</label>
        <select id="filter-type">
            <option value="">Tous les types</option>
            <option value="decaissement">📤 Ajout</option>
            <option value="encaissement">📥 Retrait</option>
        </select>
    </div>
    <div class="filter-actions">
        <button class="btn-filter" onclick="applyFilters()">🔍 Appliquer</button>
        <button class="btn-reset" onclick="resetFilters()">🗑️ Réinitialiser</button>
    </div>
</div>

<!-- Tableau -->
<div class="table-container">
    <div id="table-content">
        <div class="empty-state">
            <div class="empty-state-icon">⏳</div>
            <div>Chargement...</div>
        </div>
    </div>
</div>

<div id="pagination-container" class="pagination"></div>

<div class="loading" id="loading">⏳ Chargement...</div>

<script>
    let currentPage = 1;

    async function loadHistorique() {
        const loading = document.getElementById('loading');
        loading.style.display = 'flex';

        const params = new URLSearchParams();
        params.set('page', currentPage);
        
        const dateDebut = document.getElementById('filter-date-debut').value;
        const dateFin = document.getElementById('filter-date-fin').value;
        const agentId = document.getElementById('filter-agent').value;
        const typeOp = document.getElementById('filter-type').value;
        
        if (dateDebut) params.set('date_debut', dateDebut);
        if (dateFin) params.set('date_fin', dateFin);
        if (agentId) params.set('agent_id', agentId);
        if (typeOp) params.set('type', typeOp);

        try {
            const response = await fetch(`/api/historique-agent/page/?${params.toString()}`);
            const data = await response.json();
            
            if (data.success) {
                updateStats(data.stats);
                renderTable(data.historique);
                renderPagination(data.pagination);
            } else {
                document.getElementById('table-content').innerHTML = '<div class="empty-state">❌ Erreur de chargement</div>';
            }
        } catch (err) {
            document.getElementById('table-content').innerHTML = '<div class="empty-state">🔌 Erreur de connexion</div>';
        } finally {
            loading.style.display = 'none';
        }
    }

    function updateStats(stats) {
        const ajouts = stats.total_ajouts || 0;
        const retraits = stats.total_retraits || 0;
        const solde = ajouts - retraits;
        
        document.getElementById('stat-ajouts').innerHTML = ajouts.toLocaleString() + ' F';
        document.getElementById('stat-retraits').innerHTML = retraits.toLocaleString() + ' F';
        document.getElementById('stat-solde').innerHTML = solde.toLocaleString() + ' F';
        document.getElementById('stat-solde').className = 'stat-value ' + (solde >= 0 ? 'positive' : 'negative');
        document.getElementById('stat-nb').innerHTML = (stats.total_operations || 0).toLocaleString();
    }

    function renderTable(historique) {
        if (!historique || historique.length === 0) {
            document.getElementById('table-content').innerHTML = '<div class="empty-state">📭 Aucune opération trouvée</div>';
            return;
        }

        let html = `
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Type</th>
                        <th>Opérateur</th>
                        <th>Agent</th>
                        <th>Montant</th>
                        <th>Description</th>
                    </tr>
                </thead>
                <tbody>
        `;

        for (const op of historique) {
            const isAjout = op.type_operation === 'decaissement';
            const badgeClass = isAjout ? 'badge-success' : 'badge-danger';
            const badgeText = isAjout ? '📤 Ajout' : '📥 Retrait';
            const amountClass = isAjout ? 'amount-positive' : 'amount-negative';
            const operatorIcon = op.operateur_type === 'admin' ? '👨‍💼' : '🤝';
            
            html += `
                <tr>
                    <td style="white-space: nowrap;">${op.date}</td>
                    <td><span class="badge ${badgeClass}">${badgeText}</span></td>
                    <td>${operatorIcon} ${op.operateur_nom}</td>
                    <td><strong>${op.agent}</strong></td>
                    <td class="${amountClass}">${op.montant_total.toLocaleString()} FCFA</td>
                    <td style="color: var(--gray-500);">${op.description || '—'}</td>
                </tr>
            `;
        }

        html += `
                </tbody>
            </table>
        `;
        
        document.getElementById('table-content').innerHTML = html;
    }

    function renderPagination(pagination) {
        const container = document.getElementById('pagination-container');
        
        if (!pagination || pagination.total_pages <= 1) {
            container.innerHTML = '';
            return;
        }
        
        let html = '';
        
        if (pagination.has_previous) {
            html += `<button class="page-btn" data-page="${pagination.previous_page}">← Précédent</button>`;
        } else {
            html += `<span class="page-btn disabled">← Précédent</span>`;
        }
        
        for (let i = pagination.start_page; i <= pagination.end_page; i++) {
            if (i === pagination.current_page) {
                html += `<span class="page-btn active">${i}</span>`;
            } else {
                html += `<button class="page-btn" data-page="${i}">${i}</button>`;
            }
        }
        
        if (pagination.has_next) {
            html += `<button class="page-btn" data-page="${pagination.next_page}">Suivant →</button>`;
        } else {
            html += `<span class="page-btn disabled">Suivant →</span>`;
        }
        
        container.innerHTML = html;
        
        document.querySelectorAll('.page-btn[data-page]').forEach(btn => {
            btn.addEventListener('click', () => {
                currentPage = parseInt(btn.dataset.page);
                loadHistorique();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        });
    }

    function applyFilters() {
        currentPage = 1;
        loadHistorique();
    }

    function resetFilters() {
        document.getElementById('filter-date-debut').value = '';
        document.getElementById('filter-date-fin').value = '';
        document.getElementById('filter-agent').value = '';
        document.getElementById('filter-type').value = '';
        currentPage = 1;
        loadHistorique();
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadHistorique();
    });
</script>
{% endblock %}
